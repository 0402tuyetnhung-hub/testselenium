name: Selenium Test Suite
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test-pass:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Run pass tests
        run: mvn clean test -Dtest=TluLoginTest#testDangNhapThanhCong
      - name: Upload pass test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-pass
          path: target/surefire-reports/

  test-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
      - name: Run fail tests
        run: mvn clean test -Dtest=TluLoginTest#testDangNhapThatBai
      - name: Upload fail test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-fail
          path: target/surefire-reports/
